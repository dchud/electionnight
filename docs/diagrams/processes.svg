<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 575" role="img" aria-labelledby="proc-title">
  <title id="proc-title">The pipeline process is the only writer to DuckLake. The web process and its child processes read it, and each other process reaches the pipeline through files.</title>
  <style>
    .pr-bg { fill: var(--surface-1, #fcfcfb); }
    .pr-proc { fill: var(--surface-2, #efefec); stroke: var(--text-3, #6f6e69); stroke-width: 2; }
    .pr-writer { fill: var(--surface-2, #efefec); stroke: var(--accent, #6250d6); stroke-width: 3.5; }
    .pr-file { fill: var(--surface-1, #fcfcfb); stroke: var(--text-3, #6f6e69); stroke-width: 1.5; stroke-dasharray: 5 3; }
    .pr-name { fill: var(--text-1, #0b0b0b); font: 650 17px ui-sans-serif, system-ui, sans-serif; }
    .pr-note { fill: var(--text-2, #52514e); font: 400 14px ui-sans-serif, system-ui, sans-serif; }
    .pr-line { fill: none; stroke: var(--text-2, #52514e); stroke-width: 2; }
    .pr-write { fill: none; stroke: var(--accent, #6250d6); stroke-width: 3; }
    .pr-head { fill: var(--text-2, #52514e); }
    .pr-head-write { fill: var(--accent, #6250d6); }
  </style>
  <defs>
    <marker id="pr-arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path class="pr-head" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
    <marker id="pr-arrow-write" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path class="pr-head-write" d="M0 0 L10 5 L0 10 Z"/>
    </marker>
  </defs>
  <rect class="pr-bg" width="960" height="575"/>

  <rect class="pr-proc" x="20" y="16" width="200" height="66" rx="6"/>
  <text class="pr-name" x="32" y="40">monitor command</text>
  <text class="pr-note" x="32" y="62">a one-off CLI process</text>

  <rect class="pr-file" x="280" y="16" width="170" height="66" rx="6"/>
  <text class="pr-name" x="292" y="40">data/control/</text>
  <text class="pr-note" x="292" y="62">request files</text>

  <rect class="pr-writer" x="20" y="130" width="300" height="240" rx="8"/>
  <text class="pr-name" x="36" y="158">pipeline process</text>
  <text class="pr-note" x="36" y="184">The only writer to the lake.</text>
  <text class="pr-note" x="36" y="212">Runs the poller, the parser stages,</text>
  <text class="pr-note" x="36" y="232">the commit job, rollups, briefs,</text>
  <text class="pr-note" x="36" y="252">and maintenance.</text>

  <rect class="pr-file" x="36" y="282" width="268" height="72" rx="6"/>
  <text class="pr-name" x="48" y="306">data/writer.lock</text>
  <text class="pr-note" x="48" y="326">held while the process lives;</text>
  <text class="pr-note" x="48" y="344">a second writer cannot start</text>

  <rect class="pr-file" x="400" y="130" width="190" height="66" rx="6"/>
  <text class="pr-name" x="412" y="154">data/status.json</text>
  <text class="pr-note" x="412" y="176">written every 10 s</text>

  <rect class="pr-file" x="400" y="222" width="190" height="96" rx="6"/>
  <text class="pr-name" x="412" y="248">DuckLake</text>
  <text class="pr-note" x="412" y="270">data/catalog.sqlite</text>
  <text class="pr-note" x="412" y="290">data/lake/</text>

  <rect class="pr-file" x="400" y="352" width="190" height="66" rx="6"/>
  <text class="pr-name" x="412" y="376">data/archive/</text>
  <text class="pr-note" x="412" y="398">feed and page bytes</text>

  <rect class="pr-proc" x="670" y="130" width="270" height="170" rx="8"/>
  <text class="pr-name" x="686" y="158">web process</text>
  <text class="pr-note" x="686" y="184">Attaches the lake read-only.</text>
  <text class="pr-note" x="686" y="212">Read model, dashboard panels,</text>
  <text class="pr-note" x="686" y="232">SSE hub, and these teaching</text>
  <text class="pr-note" x="686" y="252">views.</text>

  <rect class="pr-proc" x="670" y="352" width="270" height="110" rx="8"/>
  <text class="pr-name" x="686" y="378">child process</text>
  <text class="pr-note" x="686" y="402">One at a time, low priority, stopped</text>
  <text class="pr-note" x="686" y="422">at a time limit. Opens data files for</text>
  <text class="pr-note" x="686" y="442">the teaching views. Read-only.</text>

  <rect class="pr-proc" x="540" y="16" width="130" height="66" rx="6"/>
  <text class="pr-name" x="552" y="40">Browser</text>
  <text class="pr-note" x="552" y="62">pages, SSE</text>

  <rect class="pr-file" x="740" y="16" width="200" height="66" rx="6"/>
  <text class="pr-name" x="752" y="40">data/ui.sqlite</text>
  <text class="pr-note" x="752" y="62">watchlist, overrides</text>

  <path class="pr-line" marker-end="url(#pr-arrow)" d="M220 49 H280"/>
  <path class="pr-line" marker-end="url(#pr-arrow)" d="M300 82 V130"/>
  <text class="pr-note" x="310" y="112">read every 2 s</text>
  <path class="pr-line" marker-end="url(#pr-arrow)" stroke-dasharray="6 4" d="M20 70 H8 V318 H36"/>
  <text class="pr-note" x="28" y="108">tries this lock first</text>

  <path class="pr-line" marker-end="url(#pr-arrow)" d="M320 163 H400"/>
  <text class="pr-note" x="334" y="153">writes</text>
  <path class="pr-write" marker-start="url(#pr-arrow-write)" marker-end="url(#pr-arrow-write)" d="M320 268 H400"/>
  <text class="pr-note" x="324" y="258">read, write</text>
  <path class="pr-line" marker-end="url(#pr-arrow)" d="M320 340 H360 V385 H400"/>
  <text class="pr-note" x="334" y="404">writes</text>

  <path class="pr-line" marker-end="url(#pr-arrow)" d="M590 163 H670"/>
  <text class="pr-note" x="608" y="153">reads</text>
  <path class="pr-line" marker-end="url(#pr-arrow)" d="M590 250 H670"/>
  <text class="pr-note" x="597" y="240">read only</text>
  <path class="pr-line" marker-end="url(#pr-arrow)" d="M590 298 L670 372"/>
  <text class="pr-note" x="597" y="358">reads</text>
  <path class="pr-line" marker-end="url(#pr-arrow)" d="M590 400 H670"/>
  <text class="pr-note" x="608" y="390">reads</text>

  <path class="pr-line" marker-end="url(#pr-arrow)" d="M805 300 V352"/>
  <text class="pr-note" x="815" y="332">starts, stops</text>

  <path class="pr-line" marker-start="url(#pr-arrow)" marker-end="url(#pr-arrow)" d="M605 82 L705 130"/>
  <path class="pr-line" marker-start="url(#pr-arrow)" marker-end="url(#pr-arrow)" d="M840 82 V130"/>
  <text class="pr-note" x="830" y="112" text-anchor="end">own preferences</text>

    <text class="pr-name" x="20" y="512">The single-writer rule</text>
  <text class="pr-note" x="20" y="536">Only pipeline writes to the lake. A monitor command that writes takes the lock itself when no pipeline</text>
  <text class="pr-note" x="20" y="556">runs, and otherwise leaves a request in data/control/ for the pipeline to carry out.</text>
</svg>
