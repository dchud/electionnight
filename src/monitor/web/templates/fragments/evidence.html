<h2 class="panel-title mb-1">{{ total }} stories · {{ outlets }} {{ 'outlet' if outlets == 1 else 'outlets' }}{% if mentions is not none %} · {{ mentions }} {{ 'toned mentions' if toned else 'mentions' }}{% endif %}</h2>
<div class="filter-line">{{ description }}</div>
{% include "fragments/wire_rows.html" %}
{% if (page + 1) * page_size < total %}
<button class="drawer-close mt-2" hx-get="/frag/evidence?{{ next_params }}&page={{ page + 1 }}" hx-target="#drawer-body">Next {{ page_size }}</button>
{% endif %}
