{% if outlets %}
<table class="table">
  <thead><tr><th>Outlet</th><th>Lean</th><th>First report</th><th>Items</th></tr></thead>
  <tbody>
  {% for row in outlets %}
  <tr>
    <td>{{ row.outlet }}</td>
    <td><a class="text-link" href="/sources?{{ qs }}#{{ row.source_id }}" title="{{ row.lean|lean_title }}">{% if row.glyph %}<span class="glyph">{{ row.glyph }}</span>{% else %}<span class="lean-neutral">{{ row.lean }}</span>{% endif %}</a></td>
    <td class="num">{{ row.first_report|et_datetime }}</td>
    <td class="num"><span class="count-link" data-evidence="kind=storyline&key={{ page_key }}&also=source:{{ row.source_id|urlencode }}&copies=all" role="button" tabindex="0">{{ row.n }}</span></td>
  </tr>
  {% endfor %}
  </tbody>
</table>
{% else %}
<div class="empty">No outlets covered this storyline in this window.</div>
{% endif %}
