# National figures added to the candidate roster by hand.
#
# `monitor ref build-candidates` merges these into `data/ref/entities.jsonl`.
# An entry whose name and state match a candidate merges with that candidate.
# `state` is set for people whose office belongs to a state and left null for
# national figures. `wiki_title` names the article when it differs from the
# name, and supplies the Wikidata id. `incumbent` means the person holds the
# listed office.
#
# Office-holders were checked on 2026-11-01 against the Wikipedia articles for
# each office or person, plus web search for the party and committee chairs.
retrieved_on: "2026-11-01"
