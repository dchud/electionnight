# Poll closing times for the Nov 3, 2026 general election.
#
# Times are 24-hour Eastern Standard Time clock times, the latest scheduled
# closing for each part of a state. `first_close` is when polls start closing
# in that state and `all_close` is when the last ones close. A time before
# 12:00 falls on Nov 4. Voters in line at closing time may still vote.
